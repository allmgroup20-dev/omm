name: Deploy OMM to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: mkdir -p data
      - run: npm run db:migrate
        env:
          DATABASE_URL: ./data/omm.db
      - run: npm run test
        env:
          DATABASE_URL: ./data/omm.db
          AUTH_SECRET: ci-test-secret-must-be-32-chars-long-12345
      - run: npm run build -- --webpack
        env:
          DATABASE_URL: ./data/omm.db
          AUTH_SECRET: ci-test-secret-must-be-32-chars-long-12345

  deploy:
    needs: test
    # Skip (don't fail) when Cloudflare secrets aren't configured yet.
    # Site is deployed directly until then; add the 2 secrets to enable auto-deploy.
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - name: Build Cloudflare Worker (OpenNext)
        run: npx @opennextjs/cloudflare@1 build
        env:
          # Ensure next.config headers are applied
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers (production)
        uses: cloudflare/wrangler-action@v3
        env:
          # Belt-and-braces: ensure nested opennextjs-cloudflare deploy -> wrangler child also sees the token
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          # wrangler.jsonc already has routes: omm.jobayergroup.com/*
          # Ensure D1/KV/R2 already created via `wrangler d1 create` etc. (see DEPLOYMENT.md)

      - name: Run D1 migrations (if any)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Execute latest drizzle SQL if you use D1 migrations via file
          # This is a no-op if file already applied (idempotent check in migrate.ts)
          command: d1 execute omm-db --remote --file=./drizzle/0001_kind_bucky.sql --env production
